<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Web 對講機 - v10.8 在線成員與收聽回執版</title>
  
  <link rel="manifest" href="data:application/manifest+json;charset=utf-8,%7B%22name%22%3A%22Web%20%E5%B0%8D%E8%AC%9B%E6%A9%9F%22%2C%22short_name%22%3A%22%E5%B0%8D%E8%AC%9B%E6%A9%9F%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%230b0d10%22%2C%22theme_color%22%3A%22%230b0d10%22%7D">
  <meta name="theme-color" content="#0b0d10">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="對講機">
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0b0d10;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      margin: 0;
      padding: 14px 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }
    .ver {
      font-size: 13px;
      color: #00e5ff;
      background: rgba(0, 229, 255, 0.12);
      padding: 5px 14px;
      border-radius: 20px;
      margin-bottom: 8px;
      font-weight: 600;
    }
    details {
      width: 90%;
      max-width: 400px;
      background: #14171d;
      border: 1px solid #262b33;
      border-radius: 10px;
      margin-bottom: 8px;
      box-sizing: border-box;
      overflow: hidden;
    }
    summary {
      padding: 8px 12px;
      font-size: 12px;
      color: #90a4ae;
      cursor: pointer;
      font-weight: 600;
      outline: none;
      background: #1c2026;
      border-bottom: 1px solid #262b33;
    }
    details[open] summary {
      border-bottom: 1px solid #262b33;
    }
    .badges {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px;
      padding: 10px;
      font-size: 11px;
    }
    .badge {
      padding: 4px 8px;
      border-radius: 6px;
      background: #1c2026;
      color: #78909c;
      border: 1px solid #2c323b;
    }
    .badge.ok {
      color: #00e676;
      border-color: rgba(0, 230, 118, 0.4);
      background: rgba(0, 230, 118, 0.08);
    }
    .badge.warn {
      color: #ffab00;
      border-color: rgba(255, 171, 0, 0.4);
      background: rgba(255, 171, 0, 0.08);
    }
    .badge.off {
      color: #ff5252;
      border-color: rgba(255, 82, 82, 0.4);
      background: rgba(255, 82, 82, 0.08);
    }
    .controls-bar {
      display: none;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      padding: 10px;
    }
    select, .ctrl-btn {
      background: #1c2026;
      color: #eceff1;
      border: 1px solid #37474f;
      padding: 7px 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    #micSelect {
      width: 100%;
      text-overflow: ellipsis;
      overflow: hidden;
      white-space: nowrap;
    }
    .ctrl-btn.mic-on {
      border-color: #ff5252;
      color: #ff8a80;
      background: rgba(255, 82, 82, 0.1);
    }
    .ctrl-btn.mic-off {
      border-color: #00e676;
      color: #69f0ae;
      background: rgba(0, 230, 118, 0.1);
    }
    .ctrl-btn.stt-on {
      border-color: #00e5ff;
      color: #84ffff;
      background: rgba(0, 229, 255, 0.1);
    }
    .pwd-row, .vol-row {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: #1c2026;
      border: 1px solid #37474f;
      padding: 7px 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      color: #eceff1;
      box-sizing: border-box;
    }
    .pwd-input {
      flex: 1;
      background: transparent;
      border: none;
      color: #00e5ff;
      font-size: 13px;
      font-family: monospace;
      outline: none;
      user-select: text;
      -webkit-user-select: text;
    }
    .pwd-input::placeholder {
      color: #78909c;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .vol-row input[type="range"] {
      flex: 1;
      accent-color: #00e5ff;
      cursor: pointer;
      height: 6px;
    }
    .vol-val {
      min-width: 42px;
      text-align: right;
      color: #00e5ff;
      font-family: monospace;
    }
    .hint-box {
      width: 100%;
      font-size: 11px;
      color: #ffab00;
      background: rgba(255, 171, 0, 0.08);
      border: 1px solid rgba(255, 171, 0, 0.3);
      padding: 6px 8px;
      border-radius: 6px;
      line-height: 1.4;
      display: none;
    }

    /* =========================================
       常駐顯眼：在線成員與即時收聽指示面板
       ========================================= */
    .presence-panel {
      display: none;
      width: 90%;
      max-width: 400px;
      background: #14171d;
      border: 1px solid #2c3540;
      border-radius: 10px;
      padding: 8px 10px;
      margin-bottom: 10px;
      box-sizing: border-box;
    }
    .presence-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: #b0bec5;
      font-weight: 600;
      margin-bottom: 6px;
      padding-bottom: 4px;
      border-bottom: 1px solid #222831;
    }
    .presence-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .peer-empty {
      font-size: 12px;
      color: #ffab00;
      width: 100%;
      text-align: center;
      padding: 4px 0;
    }
    .peer-chip {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      border-radius: 8px;
      background: #1c222b;
      border: 1px solid #37474f;
      font-size: 12px;
      font-weight: 600;
      color: #cfd8dc;
      transition: all 0.12s ease;
    }
    .peer-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #00e676;
      box-shadow: 0 0 6px #00e676;
    }
    /* 當對方正收到你把聲時：強螢光綠顯眼提示 */
    .peer-chip.hearing {
      background: rgba(0, 230, 118, 0.22);
      border-color: #00e676;
      color: #ffffff;
      box-shadow: 0 0 12px rgba(0, 230, 118, 0.5);
      transform: scale(1.03);
    }
    .peer-chip.hearing .peer-dot {
      background: #ffff00;
      box-shadow: 0 0 8px #ffff00;
    }
    /* 當對方正在講嘢時：藍色提示 */
    .peer-chip.speaking {
      background: rgba(0, 229, 255, 0.18);
      border-color: #00e5ff;
      color: #84ffff;
    }
    .peer-status-tag {
      font-size: 11px;
      font-family: monospace;
      color: #90a4ae;
    }
    .peer-chip.hearing .peer-status-tag {
      color: #69f0ae;
      font-weight: bold;
    }

    .status {
      margin-bottom: 10px;
      font-size: 14px;
      color: #cfd8dc;
      padding: 0 20px;
      text-align: center;
    }
    #initBtn {
      margin-top: 20px;
      padding: 16px 34px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 12px;
      border: none;
      background: #2979ff;
      color: white;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(41, 121, 255, 0.35);
    }
    #pttBtn {
      width: 185px;
      height: 185px;
      border-radius: 50%;
      border: 4px solid rgba(255, 255, 255, 0.15);
      background: #ff1744;
      color: white;
      font-size: 20px;
      font-weight: bold;
      box-shadow: 0 10px 25px rgba(255, 23, 68, 0.45);
      display: none;
      touch-action: none;
      transition: transform 0.08s ease, background 0.1s ease;
      padding: 0 16px;
      flex-shrink: 0;
      margin-top: 4px;
      cursor: pointer;
    }
    #pttBtn.active {
      background: #d50000;
      transform: scale(0.95);
      box-shadow: 0 4px 15px rgba(255, 23, 68, 0.7);
    }
    #pttBtn.receiving {
      background: #00c853;
      box-shadow: 0 10px 25px rgba(0, 200, 83, 0.45);
    }
    #pttBtn.disabled-mic {
      background: #37474f;
      color: #90a4ae;
      box-shadow: none;
      border-color: #263238;
    }
    #pttBtn.offline {
      background: #546e7a;
      box-shadow: none;
    }
    .chat-box {
      display: none;
      width: 90%;
      max-width: 400px;
      height: 155px;
      margin-top: 12px;
      background: #14171d;
      border: 1px solid #262b33;
      border-radius: 10px;
      padding: 10px 12px;
      overflow-y: auto;
      font-size: 14px;
      line-height: 1.5;
      box-sizing: border-box;
    }
    .chat-msg {
      margin-bottom: 6px;
      word-break: break-word;
    }
    .chat-msg .time {
      color: #607d8b;
      font-size: 11px;
      margin-right: 4px;
      font-family: monospace;
    }
    .chat-msg .sender {
      font-weight: bold;
      margin-right: 6px;
      font-family: monospace;
    }
    .chat-msg.me .sender { color: #00e5ff; }
    .chat-msg.other .sender { color: #00e676; }
    .chat-msg.interim {
      color: #90a4ae;
      font-style: italic;
    }
    .manual-sub-row {
      display: none;
      width: 90%;
      max-width: 400px;
      margin-top: 6px;
      gap: 6px;
      box-sizing: border-box;
    }
    .manual-sub-input {
      flex: 1;
      background: #14171d;
      border: 1px solid #262b33;
      border-radius: 8px;
      padding: 8px 10px;
      color: #fff;
      font-size: 13px;
      outline: none;
      user-select: text;
      -webkit-user-select: text;
    }
    .manual-sub-input:focus {
      border-color: #00e5ff;
    }
    .manual-sub-btn {
      background: #1c2026;
      color: #00e5ff;
      border: 1px solid #37474f;
      border-radius: 8px;
      padding: 0 14px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
    }
    .debug {
      margin-top: 10px;
      font-size: 12px;
      color: #00e676;
      font-family: monospace;
      background: #15181e;
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid #262b33;
    }
  </style>
</head>
<body>
  <div class="ver">v10.8 在線成員與收聽回執版</div>
  
  <details>
    <summary>📊 系統狀態燈號</summary>
    <div class="badges">
      <div class="badge" id="wakeBadge">螢幕常亮: 未啟動</div>
      <div class="badge" id="netBadge">網絡: 待命</div>
      <div class="badge" id="micBadge">麥克風: 未授權</div>
      <div class="badge" id="sttBadge">粵語字幕: 待命</div>
      <div class="badge warn" id="secBadge">密碼鎖: 公開模式</div>
    </div>
  </details>

  <details id="controlsDetails" style="display:none;">
    <summary>⚙️ 頻道與設定選單</summary>
    <div class="controls-bar" id="controlsBar" style="display:flex;">
      <select id="channelSelect">
        <option value="ray_walkie_hk/ch1">CH 1 (公用)</option>
        <option value="ray_walkie_hk/ch2">CH 2 (專用)</option>
        <option value="ray_walkie_hk/ch3">CH 3 (備用)</option>
        <option value="ray_walkie_hk/ch4">CH 4 (測試)</option>
      </select>
      <button class="ctrl-btn mic-on" id="toggleMicBtn">停止麥克風</button>
      <button class="ctrl-btn stt-on" id="toggleSttBtn">字幕: 開啟</button>
      
      <select id="micSelect" title="選擇麥克風裝置">
        <option value="">🎙️ 預設麥克風</option>
      </select>

      <div class="hint-box" id="pcMicHint">
        💡 <b>電腦字幕提示</b>：Chrome 語音辨識固定讀取 <b>Windows 系統預設輸入裝置</b>。如對講有聲但無字幕，請在 Windows 右下角喇叭圖示將此麥克風設為「系統預設」。
      </div>

      <div class="pwd-row">
        <span>🔑 密碼</span>
        <input type="password" id="channelPasswordInput" class="pwd-input" placeholder="輸入私人密碼防干擾 (留空為公開)">
      </div>

      <div class="vol-row">
        <span>🔊 音量</span>
        <input type="range" id="volSlider" min="0" max="200" value="100" step="5">
        <span class="vol-val" id="volValue">100%</span>
      </div>
    </div>
  </details>

  <!-- 唔放入摺疊選單，直接擺喺主畫面最顯眼位置！ -->
  <div class="presence-panel" id="presencePanel">
    <div class="presence-header">
      <span id="onlineCountLabel">👥 頻道在線成員 (0 人)</span>
      <span style="color:#00e5ff; font-family:monospace;">本機: <b id="myIdBanner">----</b></span>
    </div>
    <div class="presence-list" id="presenceList">
      <div class="peer-empty">⏳ 正在搜尋同頻道嘅在線用家...</div>
    </div>
  </div>

  <div class="status" id="statusText">請點擊下方按鈕啟動對講機</div>
  <button id="initBtn">啟用全天候對講機</button>
  <button id="pttBtn">按住通話 (PTT)</button>

  <div class="chat-box" id="chatBox">
    <div class="chat-msg" style="color:#607d8b; text-align:center; font-size:12px;">
      --- 廣東話即時字幕 (按住 PTT 講話或下方直接輸入) ---
    </div>
  </div>

  <div class="manual-sub-row" id="manualSubRow">
    <input type="text" id="manualSubInput" class="manual-sub-input" placeholder="直接打字發送字幕 (按 Enter 發送)...">
    <button id="manualSubBtn" class="manual-sub-btn">發送</button>
  </div>

  <div class="debug" id="debugText">本機 ID: ---- | TX: 0 | RX: 0</div>

  <script>
    const MQTT_BROKER = "wss://broker.hivemq.com:8884/mqtt";
    let baseTopic = "ray_walkie_hk/ch1";
    let topicSecretSuffix = "";
    let currentTopic = baseTopic;
    let currentTextTopic = baseTopic + "/text";
    let currentPresenceTopic = baseTopic + "/presence";
    const TARGET_RATE = 16000;
    const MY_ID = Math.floor(Math.random() * 0xFFFFFFFF) >>> 0;
    const MY_ID_HEX = MY_ID.toString(16).toUpperCase().padStart(8, '0').slice(0, 4);

    const IS_MOBILE = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
    const IS_EDGE = /Edg\//i.test(navigator.userAgent);
    const MY_DEV_ICON = IS_MOBILE ? "📱" : "💻";

    let client = null;
    let audioCtx = null;
    let rxGainNode = null;
    let rxVolume = 1.0;
    let micStream = null;
    let micSourceNode = null;
    let micEnabled = false;
    let selectedMicDeviceId = "";
    let scriptNode = null;
    let silencer = null;
    let wakeLock = null;
    let keepAliveTimer = null;
    let isTalking = false;
    let sttCaptureWindow = false;
    let sttWindowTimer = null;
    let nextStartTime = 0;
    let lastSample = 0;
    let txCount = 0;
    let rxCount = 0;
    let rxTimeout = null;

    // 在線成員與收聽回執追蹤
    const peers = {}; // { [idHex]: { dev, lastSeen, lastAck, lastSpeak, ackCount } }
    let lastAckSentTime = 0;
    let heartbeatTimer = null;

    const DEFAULT_MAGIC = 0x52574B31;
    let currentMagic = DEFAULT_MAGIC;
    let cipherMask = null;

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;
    let sttEnabled = true;
    let currentTranscript = "";
    let recognitionActive = false;
    let resultIndexOffset = 0;

    const initBtn = document.getElementById('initBtn');
    const pttBtn = document.getElementById('pttBtn');
    const statusText = document.getElementById('statusText');
    const debugText = document.getElementById('debugText');
    const wakeBadge = document.getElementById('wakeBadge');
    const netBadge = document.getElementById('netBadge');
    const micBadge = document.getElementById('micBadge');
    const sttBadge = document.getElementById('sttBadge');
    const secBadge = document.getElementById('secBadge');
    const controlsDetails = document.getElementById('controlsDetails');
    const channelSelect = document.getElementById('channelSelect');
    const micSelect = document.getElementById('micSelect');
    const pcMicHint = document.getElementById('pcMicHint');
    const toggleMicBtn = document.getElementById('toggleMicBtn');
    const toggleSttBtn = document.getElementById('toggleSttBtn');
    const channelPasswordInput = document.getElementById('channelPasswordInput');
    const volSlider = document.getElementById('volSlider');
    const volValue = document.getElementById('volValue');
    const chatBox = document.getElementById('chatBox');
    const manualSubRow = document.getElementById('manualSubRow');
    const manualSubInput = document.getElementById('manualSubInput');
    const manualSubBtn = document.getElementById('manualSubBtn');
    const presencePanel = document.getElementById('presencePanel');
    const presenceList = document.getElementById('presenceList');
    const onlineCountLabel = document.getElementById('onlineCountLabel');
    const myIdBanner = document.getElementById('myIdBanner');

    myIdBanner.innerText = `${MY_DEV_ICON}${MY_ID_HEX}`;

    if (!IS_MOBILE) {
      pcMicHint.style.display = 'block';
    }

    function fnv1a32(str) {
      let h = 0x811c9dc5;
      for (let i = 0; i < str.length; i++) {
        h ^= str.charCodeAt(i);
        h = Math.imul(h, 0x01000193);
      }
      return h >>> 0;
    }

    // ====================================================
    // 在線成員列表 & 真實收聽回執 (RX ACK) 核心邏輯
    // ====================================================
    function sendPresencePing() {
      if (!client || !client.connected) return;
      const payload = JSON.stringify({
        type: 'ping',
        magic: currentMagic,
        sender: MY_ID_HEX,
        dev: MY_DEV_ICON
      });
      client.publish(currentPresenceTopic, payload, { qos: 0 });
    }

    function sendRxAck(speakerHex) {
      if (!client || !client.connected) return;
      const now = Date.now();
      // 每 350ms 最多回傳一次 ACK，避免塞爆 MQTT
      if (now - lastAckSentTime < 350) return;
      lastAckSentTime = now;
      const payload = JSON.stringify({
        type: 'ack',
        magic: currentMagic,
        sender: MY_ID_HEX,
        dev: MY_DEV_ICON,
        target: speakerHex
      });
      client.publish(currentPresenceTopic, payload, { qos: 0 });
    }

    function clearPeers() {
      for (const k in peers) delete peers[k];
      renderPresenceList();
    }

    function renderPresenceList() {
      const now = Date.now();
      const activeIds = [];
      let hearingMeCount = 0;

      for (const id in peers) {
        if (now - peers[id].lastSeen > 9500) {
          delete peers[id];
        } else {
          activeIds.push(id);
        }
      }

      onlineCountLabel.innerText = `👥 頻道在線成員 (${activeIds.length} 人在線)`;

      if (activeIds.length === 0) {
        presenceList.innerHTML = `<div class="peer-empty">⚠️ 目前頻道只有你一人 (無人收聽緊)</div>`;
        return;
      }

      presenceList.innerHTML = "";
      activeIds.sort().forEach(id => {
        const p = peers[id];
        const isHearingMe = (now - p.lastAck) < 900;
        const isSpeaking = (now - p.lastSpeak) < 700;
        if (isHearingMe) hearingMeCount++;

        const chip = document.createElement('div');
        chip.className = 'peer-chip' + (isHearingMe ? ' hearing' : (isSpeaking ? ' speaking' : ''));

        let statusLabel = "待機中";
        if (isHearingMe) {
          statusLabel = `🔊 聽到你講嘢! (${p.ackCount})`;
        } else if (isSpeaking) {
          statusLabel = `🎙️ 講緊嘢...`;
        }

        chip.innerHTML = `
          <span class="peer-dot"></span>
          <span>${p.dev || '👤'} ${id}</span>
          <span class="peer-status-tag">${statusLabel}</span>
        `;
        presenceList.appendChild(chip);
      });

      if (isTalking) {
        if (hearingMeCount > 0) {
          statusText.innerText = `✅ 對方正清晰收到你把聲！(${hearingMeCount} 人收聽中)`;
        } else {
          statusText.innerText = `📡 正在廣播語音... (等待對方回執)`;
        }
      }
    }

    function startPresenceHeartbeat() {
      if (heartbeatTimer) clearInterval(heartbeatTimer);
      sendPresencePing();
      heartbeatTimer = setInterval(() => {
        sendPresencePing();
        renderPresenceList();
      }, 1000);
    }

    function refreshSubscriptionTopics() {
      const newTopic = baseTopic + topicSecretSuffix;
      const newTextTopic = newTopic + "/text";
      const newPresenceTopic = newTopic + "/presence";
      if (client && client.connected) {
        if (currentTopic !== newTopic) {
          client.unsubscribe(currentTopic);
          client.unsubscribe(currentTextTopic);
          client.unsubscribe(currentPresenceTopic);
          currentTopic = newTopic;
          currentTextTopic = newTextTopic;
          currentPresenceTopic = newPresenceTopic;
          client.subscribe(currentTopic, { qos: 0 });
          client.subscribe(currentTextTopic, { qos: 0 });
          client.subscribe(currentPresenceTopic, { qos: 0 });
          clearPeers();
          sendPresencePing();
        }
      } else {

    function applyChannelPassword(pwd) {
      if (!pwd) {
        currentMagic = DEFAULT_MAGIC;
        cipherMask = null;
        topicSecretSuffix = "";
        refreshSubscriptionTopics();
        secBadge.innerText = "密碼鎖: 公開模式";
        secBadge.className = "badge warn";
        return;
      }
      const roomHash = fnv1a32("room_topic_" + pwd).toString(16).padStart(8, '0');
      topicSecretSuffix = "/lock_" + roomHash;
      currentMagic = fnv1a32("packet_magic_" + pwd);
      if (currentMagic === DEFAULT_MAGIC) currentMagic ^= 0x12345678;
      cipherMask = new Uint8Array(64);
      let seed = fnv1a32("mask_seed_" + pwd);
      for (let i = 0; i < 64; i++) {
        seed ^= seed << 13;
        seed ^= seed >>> 17;
        seed ^= seed << 5;
        cipherMask[i] = (seed >>> 0) & 0xFF;
      }
      refreshSubscriptionTopics();
      secBadge.innerText = "密碼鎖: 已鎖定";
      secBadge.className = "badge ok";
    }

    const ULAW_DECODE = new Float32Array(256);
    (function initUlawTable() {
      for (let i = 0; i < 256; i++) {
        let u = ~i & 0xFF;
        let sign = (u & 0x80) ? -1 : 1;
        let exp = (u >> 4) & 0x07;
        let mant = u & 0x0F;
        let sample = (((mant << 3) + 0x84) << exp) - 0x84;
        ULAW_DECODE[i] = (sign * sample) / 32768.0;
      }
    })();

    function linearToUlaw(sample) {
      const BIAS = 0x84;
      const CLIP = 32635;
      let sign = (sample < 0) ? 0x80 : 0;
      if (sample < 0) sample = -sample;
      if (sample > CLIP) sample = CLIP;
      sample += BIAS;
      let exp = 7;
      for (let expMask = 0x4000; (sample & expMask) === 0 && exp > 0; exp--, expMask >>= 1) {}
      let mant = (sample >> (exp + 3)) & 0x0F;
      return (~(sign | (exp << 4) | mant)) & 0xFF;
    }

    function initSpeechRecognition() {
      if (!SpeechRecognition) {

        sttBadge.className = "badge off";
        toggleSttBtn.style.display = 'none';
        return;
      }

      recognition = new SpeechRecognition();
      recognition.lang = 'zh-HK';
      recognition.continuous = true;
      recognition.interimResults = true;

      recognition.onstart = () => {
        recognitionActive = true;
        resultIndexOffset = 0;
        sttBadge.innerText = isTalking ? "粵語字幕: 🎙️聽寫中..." : "粵語字幕: 預熱待命";
        sttBadge.className = "badge ok";
      };

      recognition.onspeechstart = () => {
        if (isTalking) {
          sttBadge.innerText = "粵語字幕: 🗣️偵測到說話!";
          sttBadge.className = "badge ok";
        }
      };

      recognition.onresult = (event) => {
        if (!isTalking && !sttCaptureWindow) {
          resultIndexOffset = event.results.length;
          return;
        }

        let interim = "";
        let finalStr = "";
        const startIdx = Math.min(resultIndexOffset, event.results.length);
        for (let i = startIdx; i < event.results.length; i++) {
          const res = event.results[i];
          const transcript = res[0].transcript;
          if (res.isFinal) {
            finalStr += transcript;
          } else {
            interim += transcript;
          }
        }
        currentTranscript = (finalStr + interim).trim();
        if (currentTranscript) {
          sttBadge.innerText = "粵語字幕: ✅已輸出字幕";
          sttBadge.className = "badge ok";
          upsertChatMessage(MY_ID_HEX, currentTranscript, false, true);
          publishTextSubtitle(currentTranscript, false);
        }
      };

      recognition.onerror = (e) => {
        if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
          sttBadge.innerText = "粵語字幕: 權限被拒";
          sttBadge.className = "badge off";
        } else if (e.error === 'network') {
          sttBadge.innerText = IS_EDGE ? "粵語字幕: Edge不支援(請用Chrome)" : "粵語字幕: 網絡阻擋";
          sttBadge.className = "badge off";
        } else if (e.error === 'audio-capture') {
          sttBadge.innerText = "粵語字幕: 找不到系統預設咪";
          sttBadge.className = "badge off";
        }
      };

      recognition.onend = () => {
        recognitionActive = false;
        if (currentTranscript && (isTalking || sttCaptureWindow)) {
          upsertChatMessage(MY_ID_HEX, currentTranscript, true, true);
          publishTextSubtitle(currentTranscript, true);
          currentTranscript = "";
        }
        if (sttEnabled && micEnabled && (!IS_MOBILE || isTalking)) {
          setTimeout(() => {
            if (sttEnabled && micEnabled && !recognitionActive && (!IS_MOBILE || isTalking)) {
              try { recognition.start(); } catch (err) {}
            }
          }, 150);
        } else if (sttEnabled) {
          sttBadge.innerText = "粵語字幕: 就緒";
          sttBadge.className = "badge ok";
        }
      };

      sttBadge.innerText = "粵語字幕: 就緒";
      sttBadge.className = "badge ok";

      if (!IS_MOBILE && sttEnabled) {
        try { recognition.start(); } catch (e) {}
      }
    }

    function playRogerBeep(freq = 1250, durationMs = 65) {
      if (!audioCtx || audioCtx.state !== 'running') return;

        osc.stop(audioCtx.currentTime + durationMs / 1000);

          try {
            const data = JSON.parse(new TextDecoder().decode(payload));
            if (!data.sender || data.sender === MY_ID_HEX || data.magic !== currentMagic) return;
            const now = Date.now();
            if (!peers[data.sender]) {
              peers[data.sender] = { dev: data.dev || '👤', lastSeen: now, lastAck: 0, lastSpeak: 0, ackCount: 0 };
            }
            peers[data.sender].lastSeen = now;
            if (data.dev) peers[data.sender].dev = data.dev;

            // 如果對方發送 ACK 目標係我，代表對方真係收到並播放緊我把聲！
            if (data.type === 'ack' && data.target === MY_ID_HEX) {
              peers[data.sender].lastAck = now;
              peers[data.sender].ackCount = (peers[data.sender].ackCount || 0) + 1;
            }
            renderPresenceList();
          } catch (e) {}
          return;
        }

        // 2. 處理即時文字字幕
        if (topic === currentTextTopic) {
          try {
            const data = JSON.parse(new TextDecoder().decode(payload));
            if (data.sender && data.sender !== MY_ID_HEX && data.text) {
              upsertChatMessage(data.sender, data.text, data.final, false);
            }
          } catch (e) {}
          return;
        }

        // 3. 處理語音封包
        if (topic !== currentTopic || isTalking || payload.byteLength <= 8) return;
        const view = new DataView(payload.buffer, payload.byteOffset, payload.byteLength);
        const packetMagic = view.getUint32(0, true);
        if (packetMagic !== currentMagic) return;
        const senderId = view.getUint32(4, true);
        if (senderId === MY_ID) return;

        const senderHex = senderId.toString(16).toUpperCase().padStart(8, '0').slice(0, 4);
        rxCount++;
        updateDebug();

        // 更新發話者狀態並立即發送「收聽回執 (ACK)」畀對方
        const now = Date.now();
        if (!peers[senderHex]) {
          peers[senderHex] = { dev: '👤', lastSeen: now, lastAck: 0, lastSpeak: now, ackCount: 0 };
        } else {
          peers[senderHex].lastSeen = now;
          peers[senderHex].lastSpeak = now;
        }
        sendRxAck(senderHex);
        renderPresenceList();

        if (IS_MOBILE && micStream && !isTalking) {
          const tracks = micStream.getAudioTracks();
          for (let i = 0; i < tracks.length; i++) {
            if (tracks[i].enabled) tracks[i].enabled = false;
          }
        }

        pttBtn.classList.add('receiving');
        pttBtn.innerText = `對方 (${senderHex})\n講話中...`;
        statusText.innerText = `🔊 正在播放 [${senderHex}] 嘅語音 (已回傳收聽確認)...`;
        clearTimeout(rxTimeout);
        rxTimeout = setTimeout(() => {
          if (!isTalking) {
            if (micStream && micEnabled) {
              const tracks = micStream.getAudioTracks();
              for (let i = 0; i < tracks.length; i++) {
                tracks[i].enabled = true;
              }
            }
            pttBtn.classList.remove('receiving');
            pttBtn.innerText = micEnabled ? "按住通話 (PTT)" : "純收聽模式\n(已關閉麥克風)";
            statusText.innerText = micEnabled ? "已連線！放開收聽，按住通話" : "純收聽模式待命中";
            playRogerBeep(1150, 70);
            renderPresenceList();
          }
        }, 350);

        const audioLen = payload.byteLength - 8;
        const audioBytes = new Uint8Array(audioLen);
        const srcBytes = new Uint8Array(payload.buffer, payload.byteOffset + 8, audioLen);
        if (cipherMask) {
          for (let i = 0; i < audioLen; i++) {
            audioBytes[i] = srcBytes[i] ^ cipherMask[i & 63];
          }
        } else {
          audioBytes.set(srcBytes);
        }
        playIncomingUlaw(audioBytes);
      });
    };

    function playIncomingUlaw(ulawBytes) {
      if (!audioCtx) return;
      if (audioCtx.state !== 'running') audioCtx.resume();
      const inLen = ulawBytes.length;
      if (inLen === 0) return;
      const nativeRate = audioCtx.sampleRate;
      const ratio = nativeRate / TARGET_RATE;
      const outLen = Math.floor(inLen * ratio);
      const upsampled = new Float32Array(outLen);
      for (let i = 0; i < outLen; i++) {
        const pos = i / ratio;
        const idx = Math.floor(pos);
        const frac = pos - idx;
        const s0 = (idx === 0) ? lastSample : ULAW_DECODE[ulawBytes[idx - 1]];
        const s1 = ULAW_DECODE[ulawBytes[idx]];
        upsampled[i] = s0 + frac * (s1 - s0);
      }
      lastSample = ULAW_DECODE[ulawBytes[inLen - 1]];
      const fadeLen = Math.min(24, Math.floor(outLen / 10));
      for (let i = 0; i < fadeLen; i++) {
        const w = i / fadeLen;
        upsampled[i] = lastSample * (1 - w) + upsampled[i] * w;
      }
      const audioBuffer = audioCtx.createBuffer(1, outLen, nativeRate);
      audioBuffer.copyToChannel(upsampled, 0);
      const source = audioCtx.createBufferSource();
      source.buffer = audioBuffer;
      source.connect(rxGainNode || audioCtx.destination);
      const now = audioCtx.currentTime;
      if (nextStartTime < now || (nextStartTime - now) > 0.16) {
        nextStartTime = now + 0.04;
      }
      source.start(nextStartTime);
      nextStartTime += audioBuffer.duration;
    }

    function encodeAudioPacket(float32Buffer, inputRate) {
      const ratio = inputRate / TARGET_RATE;
      const sampleCount = Math.floor(float32Buffer.length / ratio);
      const packet = new Uint8Array(8 + sampleCount);
      const view = new DataView(packet.buffer);
      view.setUint32(0, currentMagic, true);
      view.setUint32(4, MY_ID, true);
      for (let i = 0; i < sampleCount; i++) {
        const start = Math.floor(i * ratio);
        const end = Math.min(Math.floor((i + 1) * ratio), float32Buffer.length);
        let sum = 0;
        let count = 0;
        for (let j = start; j < end; j++) {
          sum += float32Buffer[j];
          count++;
        }
        let avg = count > 0 ? (sum / count) : float32Buffer[start];
        if (Math.abs(avg) < 0.004) {
          avg *= 0.2;
        } else {
          avg *= 2.4;
        }
        let clamped = Math.max(-1, Math.min(1, avg));
        let int16 = clamped < 0 ? (clamped * 32768) : (clamped * 32767);
        const ulawByte = linearToUlaw(int16 | 0);
        packet[8 + i] = cipherMask ? (ulawByte ^ cipherMask[i & 63]) : ulawByte;
      }
      return packet;
    }

    pttBtn.addEventListener('touchstart', (e) => { e.preventDefault(); startTalking(); });
    pttBtn.addEventListener('touchend', (e) => { e.preventDefault(); stopTalking(); });
    pttBtn.addEventListener('touchcancel', (e) => { e.preventDefault(); stopTalking(); });
    pttBtn.addEventListener('mousedown', (e) => { if (e.button === 0) { e.preventDefault(); startTalking(); } });
    window.addEventListener('mouseup', () => { if (isTalking) stopTalking(); });

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' && !e.repeat && 
          document.activeElement !== channelPasswordInput && 
          document.activeElement !== manualSubInput) {
        if (pttBtn.style.display === 'block') {
          e.preventDefault();
          startTalking();
        }
      }
    });
    window.addEventListener('keyup', (e) => {
      if (e.code === 'Space' && 
          document.activeElement !== channelPasswordInput && 
          document.activeElement !== manualSubInput) {
        if (isTalking) {
          e.preventDefault();
          stopTalking();
        }
      }
    });

    async function startTalking() {
      if (!micEnabled || !micStream) {
        statusText.innerText = "請先點擊上方「重開麥克風」才可發話！";
        return;
      }
      if (!client || !client.connected || isTalking) return;

      isTalking = true;
      sttCaptureWindow = true;
      clearTimeout(sttWindowTimer);
      currentTranscript = "";

      // 每次撳 PTT 重置今次講話嘅 ACK 計數器，方便睇清楚呢句嘢對方收到幾多包
      for (const id in peers) {
        peers[id].ackCount = 0;
      }
      renderPresenceList();

      if (sttEnabled && recognition) {
        sttBadge.innerText = "粵語字幕: 🎙️聽寫中...";
        sttBadge.className = "badge ok";
        if (!recognitionActive) {
          try { recognition.start(); } catch (e) {}
        }
      }

      const tracks = micStream.getAudioTracks();
      if (tracks.length === 0 || tracks[0].readyState === 'ended') {
        await enableMicrophone();
      }
      for (let i = 0; i < micStream.getAudioTracks().length; i++) {
        micStream.getAudioTracks()[i].enabled = true;
      }

      pttBtn.classList.remove('receiving');
      pttBtn.classList.add('active');
      pttBtn.innerText = "正在廣播中...";
      statusText.innerText = "📡 正在發送語音... (請睇上方成員燈號)";

      await ensureAudioActive();
      if (!isTalking) return;

      playRogerBeep(1500, 45);

      if (!micSourceNode) {
        micSourceNode = audioCtx.createMediaStreamSource(micStream);
      }
      scriptNode = audioCtx.createScriptProcessor(2048, 1, 1);
      silencer = audioCtx.createGain();
      silencer.gain.value = 0.0001;

      scriptNode.onaudioprocess = (e) => {
        if (!isTalking || !client.connected) return;
        const inputData = e.inputBuffer.getChannelData(0);
        const packet = encodeAudioPacket(inputData, audioCtx.sampleRate);
        client.publish(currentTopic, packet, { qos: 0 });
        txCount++;
        updateDebug();
      };

      micSourceNode.connect(scriptNode);
      scriptNode.connect(silencer);
      silencer.connect(audioCtx.destination);
    }

    function stopTalking() {
      if (!isTalking) return;
      isTalking = false;
      pttBtn.classList.remove('active');
      pttBtn.innerText = micEnabled ? "按住通話 (PTT)" : "純收聽模式\n(已關閉麥克風)";
      statusText.innerText = "通話結束，放開收聽中";

      if (micSourceNode && scriptNode) {
        try { micSourceNode.disconnect(scriptNode); } catch (e) {}
      }
      if (scriptNode) {
        try { scriptNode.disconnect(); } catch (e) {}
        scriptNode.onaudioprocess = null;
        scriptNode = null;
      }
      if (silencer) {
        try { silencer.disconnect(); } catch (e) {}
        silencer = null;
      }

      playRogerBeep(1050, 60);

      clearTimeout(sttWindowTimer);
      sttWindowTimer = setTimeout(() => {
        sttCaptureWindow = false;
        if (currentTranscript) {
          upsertChatMessage(MY_ID_HEX, currentTranscript, true, true);
          publishTextSubtitle(currentTranscript, true);
          currentTranscript = "";
        }
        if (recognition && recognitionActive) {
          try { recognition.stop(); } catch (e) {}
        }
      }, 700);
    }
  </script>
