<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Web 對講機 - v11.2 背景喚醒自癒版</title>
  <link rel="manifest" href="data:application/manifest+json;charset=utf-8,%7B%22name%22%3A%22Web%20%E5%B0%8D%E8%AC%9B%E6%A9%9F%22%2C%22short_name%22%3A%22%E5%B0%8D%E8%AC%9B%E6%A9%9F%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%230b0d10%22%2C%22theme_color%22%3A%22%230b0d10%22%7D">
  <meta name="theme-color" content="#0b0d10">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="對講機">
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0b0d10; color: #fff;
      display: flex; flex-direction: column; align-items: center;
      min-height: 100vh; margin: 0; padding: 14px 0;
      box-sizing: border-box; user-select: none; -webkit-user-select: none;
    }
    .ver {
      font-size: 13px; color: #00e5ff; background: rgba(0, 229, 255, 0.12);
      padding: 5px 14px; border-radius: 20px; margin-bottom: 8px; font-weight: 600;
    }
    details, .presence-panel, .mic-meter-wrap, .chat-box, .manual-sub-row, .debug {
      width: 90%; max-width: 400px; box-sizing: border-box;
    }
    details {
      background: #14171d; border: 1px solid #262b33;
      border-radius: 10px; margin-bottom: 8px; overflow: hidden;
    }
    summary {
      padding: 8px 12px; font-size: 12px; color: #90a4ae; cursor: pointer;
      font-weight: 600; outline: none; background: #1c2026; border-bottom: 1px solid #262b33;
    }
    .badges, .controls-bar {
      display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; padding: 10px;
    }
    .badges { font-size: 11px; }
    .controls-bar { gap: 8px; }
    .badge {
      padding: 4px 8px; border-radius: 6px; background: #1c2026;
      color: #78909c; border: 1px solid #2c323b;
    }
    .badge.ok { color: #00e676; border-color: rgba(0,230,118,0.4); background: rgba(0,230,118,0.08); }
    .badge.warn { color: #ffab00; border-color: rgba(255,171,0,0.4); background: rgba(255,171,0,0.08); }
    .badge.off { color: #ff5252; border-color: rgba(255,82,82,0.4); background: rgba(255,82,82,0.08); }
    select, .ctrl-btn {
      background: #1c2026; color: #eceff1; border: 1px solid #37474f;
      padding: 7px 12px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer;
    }
    #micSelect { width: 100%; text-overflow: ellipsis; overflow: hidden; white-space: nowrap; }
    .ctrl-btn.mic-on { border-color: #ff5252; color: #ff8a80; background: rgba(255,82,82,0.1); }
    .ctrl-btn.mic-off { border-color: #00e676; color: #69f0ae; background: rgba(0,230,118,0.1); }
    .ctrl-btn.stt-on { border-color: #00e5ff; color: #84ffff; background: rgba(0,229,255,0.1); }
    .pwd-row, .vol-row {
      width: 100%; display: flex; align-items: center; justify-content: space-between;
      gap: 8px; background: #1c2026; border: 1px solid #37474f;
      padding: 7px 12px; border-radius: 8px; font-size: 13px; font-weight: 600;
      color: #eceff1; box-sizing: border-box;
    }
    .pwd-input {
      flex: 1; background: transparent; border: none; color: #00e5ff;
      font-size: 13px; font-family: monospace; outline: none;
      user-select: text; -webkit-user-select: text;
    }
    .pwd-input::placeholder { color: #78909c; font-family: sans-serif; }
    .vol-row input[type="range"] { flex: 1; accent-color: #00e5ff; cursor: pointer; height: 6px; }
    .vol-val { min-width: 42px; text-align: right; color: #00e5ff; font-family: monospace; }
    .hint-box {
      width: 100%; font-size: 11px; color: #ffab00; background: rgba(255,171,0,0.08);
      border: 1px solid rgba(255,171,0,0.3); padding: 6px 8px; border-radius: 6px;
      line-height: 1.4; display: none;
    }
    .presence-panel {
      display: none; background: #14171d; border: 1px solid #2c3540;
      border-radius: 10px; padding: 8px 10px; margin-bottom: 8px;
    }
    .presence-header {
      display: flex; justify-content: space-between; align-items: center;
      font-size: 12px; color: #b0bec5; font-weight: 600;
      margin-bottom: 6px; padding-bottom: 4px; border-bottom: 1px solid #222831;
    }
    .presence-list { display: flex; flex-wrap: wrap; gap: 6px; }
    .peer-empty { font-size: 12px; color: #ffab00; width: 100%; text-align: center; padding: 4px 0; }
    .peer-chip {
      display: flex; align-items: center; gap: 6px; padding: 5px 10px;
      border-radius: 8px; background: #1c222b; border: 1px solid #37474f;
      font-size: 12px; font-weight: 600; color: #cfd8dc; transition: all 0.12s ease;
    }
    .peer-dot { width: 8px; height: 8px; border-radius: 50%; background: #00e676; box-shadow: 0 0 6px #00e676; }
    .peer-chip.hearing {
      background: rgba(0,230,118,0.22); border-color: #00e676; color: #fff;
      box-shadow: 0 0 12px rgba(0,230,118,0.5); transform: scale(1.03);
    }
    .peer-chip.hearing .peer-dot { background: #ff0; box-shadow: 0 0 8px #ff0; }
    .peer-chip.speaking { background: rgba(0,229,255,0.18); border-color: #00e5ff; color: #84ffff; }
    .peer-status-tag { font-size: 11px; font-family: monospace; color: #90a4ae; }
    .peer-chip.hearing .peer-status-tag { color: #69f0ae; font-weight: bold; }
    .mic-meter-wrap {
      display: none; background: #14171d; border: 1px solid #262b33;
      border-radius: 8px; padding: 6px 10px; margin-bottom: 8px;
      align-items: center; gap: 8px; font-size: 11px; color: #90a4ae;
    }
    .mic-meter-bar-bg { flex: 1; height: 8px; background: #1c2026; border-radius: 4px; overflow: hidden; border: 1px solid #2c323b; }
    .mic-meter-bar-fill { width: 0%; height: 100%; background: linear-gradient(90deg, #00e676, #ffea00, #ff1744); transition: width 0.06s linear; }
    .mic-meter-pct { min-width: 34px; text-align: right; font-family: monospace; color: #00e676; }
    .status { margin-bottom: 8px; font-size: 14px; color: #cfd8dc; padding: 0 20px; text-align: center; }
    #initBtn {
      margin-top: 20px; padding: 16px 34px; font-size: 18px; font-weight: bold;
      border-radius: 12px; border: none; background: #2979ff; color: #fff;
      cursor: pointer; box-shadow: 0 6px 20px rgba(41,121,255,0.35);
    }
    #pttBtn {
      width: 185px; height: 185px; border-radius: 50%;
      border: 4px solid rgba(255,255,255,0.15); background: #ff1744; color: #fff;
      font-size: 20px; font-weight: bold; box-shadow: 0 10px 25px rgba(255,23,68,0.45);
      display: none; touch-action: none; transition: transform 0.08s ease, background 0.1s ease;
      padding: 0 16px; flex-shrink: 0; margin-top: 4px; cursor: pointer;
    }
    #pttBtn.active { background: #d50000; transform: scale(0.95); box-shadow: 0 4px 15px rgba(255,23,68,0.7); }
    #pttBtn.receiving { background: #00c853; box-shadow: 0 10px 25px rgba(0,200,83,0.45); }
    #pttBtn.disabled-mic { background: #37474f; color: #90a4ae; box-shadow: none; border-color: #263238; }
    #pttBtn.offline { background: #546e7a; box-shadow: none; }
    .chat-box {
      display: none; height: 150px; margin-top: 12px; background: #14171d;
      border: 1px solid #262b33; border-radius: 10px; padding: 10px 12px;
      overflow-y: auto; font-size: 14px; line-height: 1.5;
    }
    .chat-msg { margin-bottom: 6px; word-break: break-word; }
    .chat-msg .time { color: #607d8b; font-size: 11px; margin-right: 4px; font-family: monospace; }
    .chat-msg .sender { font-weight: bold; margin-right: 6px; font-family: monospace; }
    .chat-msg.me .sender { color: #00e5ff; }
    .chat-msg.other .sender { color: #00e676; }
    .chat-msg.interim { color: #90a4ae; font-style: italic; }
    .manual-sub-row { display: none; margin-top: 6px; gap: 6px; }
    .manual-sub-input {
      flex: 1; background: #14171d; border: 1px solid #262b33; border-radius: 8px;
      padding: 8px 10px; color: #fff; font-size: 13px; outline: none;
      user-select: text; -webkit-user-select: text;
    }
    .manual-sub-input:focus { border-color: #00e5ff; }
    .manual-sub-btn {
      background: #1c2026; color: #00e5ff; border: 1px solid #37474f;
      border-radius: 8px; padding: 0 14px; font-size: 13px; font-weight: bold; cursor: pointer;
    }
    .debug {
      margin-top: 8px; font-size: 12px; color: #00e676; font-family: monospace;
      background: #15181e; padding: 6px 12px; border-radius: 6px;
      border: 1px solid #262b33; text-align: center;
    }
  </style>
</head>
<body>
  <div class="ver">v11.2 背景喚醒自癒版</div>
  
  <details>
    <summary>📊 系統狀態燈號</summary>
    <div class="badges">
      <div class="badge" id="wakeBadge">螢幕常亮: 未啟動</div>
      <div class="badge" id="netBadge">網絡: 待命</div>
      <div class="badge" id="micBadge">麥克風: 未授權</div>
      <div class="badge" id="sttBadge">粵語字幕: 待命</div>
      <div class="badge warn" id="secBadge">密碼鎖: 公開模式</div>
    </div>
  </details>

  <details id="controlsDetails" style="display:none;">
    <summary>⚙️ 頻道與設定選單</summary>
    <div class="controls-bar">
      <select id="channelSelect">
        <option value="ray_walkie_hk/ch1">CH 1 (公用)</option>
        <option value="ray_walkie_hk/ch2">CH 2 (專用)</option>
        <option value="ray_walkie_hk/ch3">CH 3 (備用)</option>
        <option value="ray_walkie_hk/ch4">CH 4 (測試)</option>
      </select>
      <button class="ctrl-btn mic-on" id="toggleMicBtn">停止麥克風</button>
      <button class="ctrl-btn stt-on" id="toggleSttBtn">字幕: 開啟</button>
      <select id="micSelect" title="選擇麥克風裝置">
        <option value="">🎙️ 預設麥克風</option>
      </select>
      <div class="hint-box" id="pcMicHint">
        💡 <b>電腦字幕提示</b>：Chrome 語音辨識固定讀取 <b>Windows 系統預設輸入裝置</b>。
      </div>
      <div class="pwd-row">
        <span>🔑 密碼</span>
        <input type="password" id="channelPasswordInput" class="pwd-input" placeholder="輸入私人密碼防干擾 (留空為公開)">
      </div>
      <div class="vol-row">
        <span>🔊 音量</span>
        <input type="range" id="volSlider" min="0" max="200" value="100" step="5">
        <span class="vol-val" id="volValue">100%</span>
      </div>
    </div>
  </details>

  <div class="presence-panel" id="presencePanel">
    <div class="presence-header">
      <span id="onlineCountLabel">👥 頻道在線成員 (0 人)</span>
      <span style="color:#00e5ff; font-family:monospace;">本機: <b id="myIdBanner">----</b></span>
    </div>
    <div class="presence-list" id="presenceList">
      <div class="peer-empty">⏳ 正在搜尋同頻道嘅在線用家...</div>
    </div>
  </div>

  <div class="mic-meter-wrap" id="micMeterWrap">
    <span>🎙️ 本機咪音量:</span>
    <div class="mic-meter-bar-bg">
      <div class="mic-meter-bar-fill" id="micMeterFill"></div>
    </div>
    <span class="mic-meter-pct" id="micMeterPct">0%</span>
  </div>

  <div class="status" id="statusText">請點擊下方按鈕啟動對講機</div>
  <button id="initBtn">啟用全天候對講機</button>
  <button id="pttBtn">按住通話 (PTT)</button>

  <div class="chat-box" id="chatBox">
    <div class="chat-msg" style="color:#607d8b; text-align:center; font-size:12px;">
      --- 廣東話即時字幕 (按住 PTT 講話或下方直接輸入) ---
    </div>
  </div>

  <div class="manual-sub-row" id="manualSubRow">
    <input type="text" id="manualSubInput" class="manual-sub-input" placeholder="直接打字發送字幕 (按 Enter 發送)...">
    <button id="manualSubBtn" class="manual-sub-btn">發送</button>
  </div>

  <div class="debug" id="debugText">ID: ---- | 語音TX: 0 | 語音RX: 0 | 字幕TX: 0</div>

  <script>
    const $ = id => document.getElementById(id);
    const MQTT_BROKER = "wss://broker.hivemq.com:8884/mqtt";
    const TARGET_RATE = 16000;
    const DEFAULT_MAGIC = 0x52574B31;
    const VOICE_RMS_THRESHOLD = 0.008;
    const MAX_CHAT_HISTORY = 80;

    const MY_ID = Math.floor(Math.random() * 0xFFFFFFFF) >>> 0;
    const MY_ID_HEX = MY_ID.toString(16).toUpperCase().padStart(8, '0').slice(0, 4);
    const IS_MOBILE = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
    const IS_EDGE = /Edg\//i.test(navigator.userAgent);
    const MY_DEV_ICON = IS_MOBILE ? "📱" : "💻";

    let baseTopic = "ray_walkie_hk/ch1";
    let topicSecretSuffix = "";
    let currentTopic = baseTopic;
    let currentTextTopic = baseTopic + "/text";
    let currentPresenceTopic = baseTopic + "/presence";
    let currentMagic = DEFAULT_MAGIC;
    let cipherMask = null;

    let client = null;
    let audioCtx = null, rxGainNode = null, micSourceNode = null, scriptNode = null, silencer = null;
    let micStream = null, wakeLock = null;
    let rxVolume = 1.0, micEnabled = false, selectedMicDeviceId = "";
    let isTalking = false, hasSpokenInCurrentPtt = false, silentFrameCount = 0;
    let audioProcessFiredCount = 0, nonZeroSignalCount = 0, isRebuildingMic = false;
    let hiddenTimestamp = 0, micNeedsRefresh = false;
    let nextStartTime = 0, lastSample = 0;
    let txCount = 0, rxCount = 0, subTxCount = 0;
    let rxTimeout = null, sttStopTimer = null, pttWatchdogTimer = null, keepAliveTimer = null, heartbeatTimer = null;

    const peers = {};
    let lastAckSentTime = 0;

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null, sttEnabled = true, currentTranscript = "", recognitionActive = false;

    $('myIdBanner').innerText = `${MY_DEV_ICON}${MY_ID_HEX}`;
    if (!IS_MOBILE) $('pcMicHint').style.display = 'block';

    function setBadge(el, text, state) {
      el.innerText = text;
      el.className = "badge " + (state || "");
    }

    function updateDebug() {
      $('debugText').innerText = `ID: ${MY_ID_HEX} | 語音TX: ${txCount} | 語音RX: ${rxCount} | 字幕TX: ${subTxCount}`;
    }
    updateDebug();

    function fnv1a32(str) {
      let h = 0x811c9dc5;
      for (let i = 0; i < str.length; i++) {
        h = Math.imul(h ^ str.charCodeAt(i), 0x01000193);
      }
      return h >>> 0;
    }

    // μ-law 編解碼表
    const ULAW_DECODE = new Float32Array(256);
    for (let i = 0; i < 256; i++) {
      let u = ~i & 0xFF;
      let sign = (u & 0x80) ? -1 : 1;
      let exp = (u >> 4) & 0x07;
      let mant = u & 0x0F;
      ULAW_DECODE[i] = (sign * ((((mant << 3) + 0x84) << exp) - 0x84)) / 32768.0;
    }

    function linearToUlaw(sample) {
      let sign = (sample < 0) ? 0x80 : 0;
      if (sample < 0) sample = -sample;
      if (sample > 32635) sample = 32635;
      sample += 0x84;
      let exp = 7;
      for (let expMask = 0x4000; (sample & expMask) === 0 && exp > 0; exp--, expMask >>= 1) {}
      let mant = (sample >> (exp + 3)) & 0x0F;
      return (~(sign | (exp << 4) | mant)) & 0xFF;
    }

    // ====================================================
    // 在線成員與真實收聽回執 (RX ACK)
    // ====================================================
    function publishPresence(type, targetHex) {
      if (!client || !client.connected) return;
      const msg = { type, magic: currentMagic, sender: MY_ID_HEX, dev: MY_DEV_ICON };
      if (targetHex) msg.target = targetHex;
      client.publish(currentPresenceTopic, JSON.stringify(msg), { qos: 0 });
    }

    function sendRxAck(speakerHex) {
      const now = Date.now();
      if (now - lastAckSentTime < 350) return;
      lastAckSentTime = now;
      publishPresence('ack', speakerHex);
    }

    function renderPresenceList() {
      const now = Date.now();
      const activeIds = [];
      let hearingMeCount = 0;

      for (const id in peers) {
        if (now - peers[id].lastSeen > 9500) delete peers[id];
        else activeIds.push(id);
      }

      $('onlineCountLabel').innerText = `👥 頻道在線成員 (${activeIds.length} 人在線)`;
      const listEl = $('presenceList');

      if (activeIds.length === 0) {
        listEl.innerHTML = `<div class="peer-empty">⚠️ 目前頻道只有你一人 (無人收聽緊)</div>`;
      } else {
        listEl.innerHTML = "";
        activeIds.sort().forEach(id => {
          const p = peers[id];
          const isHearingMe = (now - p.lastAck) < 900;
          const isSpeaking = (now - p.lastSpeak) < 700;
          if (isHearingMe) hearingMeCount++;

          const chip = document.createElement('div');
          chip.className = 'peer-chip' + (isHearingMe ? ' hearing' : (isSpeaking ? ' speaking' : ''));
          const statusLabel = isHearingMe ? `🔊 聽到你講嘢! (${p.ackCount})` : (isSpeaking ? `🎙️ 講緊嘢...` : "待機中");

          chip.innerHTML = `<span class="peer-dot"></span><span>${p.dev || '👤'} ${id}</span><span class="peer-status-tag">${statusLabel}</span>`;
          listEl.appendChild(chip);
        });
      }

      if (isTalking && !isRebuildingMic) {
        if (hearingMeCount > 0) {
          $('statusText').innerText = `✅ 對方正清晰收到你把聲！(${hearingMeCount} 人收聽中)`;
        } else if (!hasSpokenInCurrentPtt && silentFrameCount > 8) {
          $('statusText').innerText = `⚠️ 麥克風無聲音輸入 (0%)！請對住咪講話或檢查裝置`;
        } else {
          $('statusText').innerText = `📡 正在廣播語音及字幕...`;
        }
      }
    }

    // ====================================================
    // 頻道與密碼管理
    // ====================================================
    function refreshSubscriptionTopics() {
      const newTopic = baseTopic + topicSecretSuffix;
      const newTextTopic = newTopic + "/text";
      const newPresenceTopic = newTopic + "/presence";
      if (client && client.connected && currentTopic !== newTopic) {
        client.unsubscribe([currentTopic, currentTextTopic, currentPresenceTopic]);
        currentTopic = newTopic;
        currentTextTopic = newTextTopic;
        currentPresenceTopic = newPresenceTopic;
        client.subscribe([currentTopic, currentTextTopic, currentPresenceTopic], { qos: 0 });
        for (const k in peers) delete peers[k];
        renderPresenceList();
        publishPresence('ping');
      } else {
        currentTopic = newTopic;
        currentTextTopic = newTextTopic;
        currentPresenceTopic = newPresenceTopic;
      }
    }

    function applyChannelPassword(pwd) {
      if (!pwd) {
        currentMagic = DEFAULT_MAGIC;
        cipherMask = null;
        topicSecretSuffix = "";
        refreshSubscriptionTopics();
        setBadge($('secBadge'), "密碼鎖: 公開模式", "warn");
        return;
      }
      topicSecretSuffix = "/lock_" + fnv1a32("room_topic_" + pwd).toString(16).padStart(8, '0');
      currentMagic = fnv1a32("packet_magic_" + pwd);
      if (currentMagic === DEFAULT_MAGIC) currentMagic ^= 0x12345678;
      cipherMask = new Uint8Array(64);
      let seed = fnv1a32("mask_seed_" + pwd);
      for (let i = 0; i < 64; i++) {
        seed ^= seed << 13; seed ^= seed >>> 17; seed ^= seed << 5;
        cipherMask[i] = (seed >>> 0) & 0xFF;
      }
      refreshSubscriptionTopics();
      setBadge($('secBadge'), "密碼鎖: 已鎖定", "ok");
    }

    const savedPwd = localStorage.getItem('walkie_channel_pwd') || '';
    if (savedPwd) {
      $('channelPasswordInput').value = savedPwd;
      applyChannelPassword(savedPwd);
    }
    $('channelPasswordInput').addEventListener('input', (e) => {
      const pwd = e.target.value.trim();
      localStorage.setItem('walkie_channel_pwd', pwd);
      applyChannelPassword(pwd);
      $('statusText').innerText = pwd ? "🔒 已鎖定私人密碼頻道" : "🔓 目前為公開頻道";
    });

    $('volSlider').oninput = (e) => {
      const pct = parseInt(e.target.value, 10);
      $('volValue').innerText = pct + "%";
      rxVolume = pct / 100.0;
      if (rxGainNode && audioCtx) rxGainNode.gain.setValueAtTime(rxVolume, audioCtx.currentTime);
    };

    $('channelSelect').onchange = (e) => {
      baseTopic = e.target.value;
      refreshSubscriptionTopics();
      playRogerBeep(1500, 50);
      $('statusText').innerText = `已切換至 ${e.target.options[e.target.selectedIndex].text}`;
    };

    // ====================================================
    // 廣東話語音辨識
    // ====================================================
    function initSpeechRecognition() {
      if (!SpeechRecognition) {
        setBadge($('sttBadge'), "粵語字幕: 瀏覽器不支援", "off");
        $('toggleSttBtn').style.display = 'none';
        return;
      }

      recognition = new SpeechRecognition();
      recognition.lang = 'zh-HK';
      recognition.continuous = false;
      recognition.interimResults = true;

      recognition.onstart = () => {
        recognitionActive = true;
        setBadge($('sttBadge'), "粵語字幕: 🎙️聽寫中...", "ok");
      };

      recognition.onspeechstart = () => {
        setBadge($('sttBadge'), "粵語字幕: 🗣️偵測到說話!", "ok");
      };

      recognition.onresult = (event) => {
        let interim = "", finalStr = "";
        for (let i = 0; i < event.results.length; i++) {
          const res = event.results[i];
          if (res.isFinal) finalStr += res[0].transcript;
          else interim += res[0].transcript;
        }
        const text = (finalStr + interim).trim();
        if (text) {
          currentTranscript = text;
          const isFinalResult = finalStr.length > 0 && interim.length === 0;
          setBadge($('sttBadge'), "粵語字幕: ✅已輸出字幕", "ok");
          upsertChatMessage(MY_ID_HEX, currentTranscript, isFinalResult, true);
          publishTextSubtitle(currentTranscript, isFinalResult);
          if (isFinalResult) currentTranscript = "";
        }
      };

      recognition.onerror = (e) => {
        if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
          setBadge($('sttBadge'), "粵語字幕: 權限被拒", "off");
        } else if (e.error === 'network') {
          setBadge($('sttBadge'), IS_EDGE ? "粵語字幕: 請用Chrome" : "粵語字幕: 網絡錯誤", "off");
        } else if (e.error === 'audio-capture') {
          setBadge($('sttBadge'), "粵語字幕: 找不到系統預設咪", "off");
        }
      };

      recognition.onend = () => {
        recognitionActive = false;
        if (currentTranscript) {
          upsertChatMessage(MY_ID_HEX, currentTranscript, true, true);
          publishTextSubtitle(currentTranscript, true);
          currentTranscript = "";
        }
        if (isTalking && sttEnabled && micEnabled) {
          try { recognition.start(); } catch (err) {}
        } else if (sttEnabled) {
          setBadge($('sttBadge'), "粵語字幕: 就緒", "ok");
        }
      };

      setBadge($('sttBadge'), "粵語字幕: 就緒", "ok");
    }

    function publishTextSubtitle(text, isFinal) {
      if (!client || !client.connected || !text) return;
      client.publish(currentTextTopic, JSON.stringify({
        magic: currentMagic, sender: MY_ID_HEX, text, final: isFinal
      }), { qos: 0 });
      subTxCount++;
      updateDebug();
    }

    function upsertChatMessage(senderHex, text, isFinal, isMe) {
      const box = $('chatBox');
      const interimId = "interim_" + senderHex;
      let msgEl = $(interimId);
      const nowStr = new Date().toTimeString().slice(0, 8);
      if (!msgEl) {
        msgEl = document.createElement('div');
        msgEl.id = interimId;
        msgEl.className = `chat-msg ${isMe ? 'me' : 'other'} interim`;
        box.appendChild(msgEl);
        while (box.children.length > MAX_CHAT_HISTORY) {
          box.removeChild(box.children[1]);
        }
      }
      const label = isMe ? `我(${senderHex})` : `對方(${senderHex})`;
      msgEl.innerHTML = `<span class="time">[${nowStr}]</span><span class="sender">${label}:</span><span class="content"></span>`;
      msgEl.querySelector('.content').innerText = text + (isFinal ? "" : " ...");
      if (isFinal) {
        msgEl.removeAttribute('id');
        msgEl.classList.remove('interim');
      }
      box.scrollTop = box.scrollHeight;
    }

    function sendManualSubtitle() {
      const input = $('manualSubInput');
      const txt = input.value.trim();
      if (!txt) return;
      upsertChatMessage(MY_ID_HEX, txt, true, true);
      publishTextSubtitle(txt, true);
      input.value = "";
    }
    $('manualSubBtn').onclick = sendManualSubtitle;
    $('manualSubInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); sendManualSubtitle(); }
    });

    $('toggleSttBtn').onclick = () => {
      sttEnabled = !sttEnabled;
      const btn = $('toggleSttBtn');
      if (sttEnabled) {
        btn.innerText = "字幕: 開啟";
        btn.className = "ctrl-btn stt-on";
        setBadge($('sttBadge'), "粵語字幕: 就緒", "ok");
      } else {
        clearTimeout(sttStopTimer);
        if (recognition && recognitionActive) { try { recognition.stop(); } catch (e) {} }
        btn.innerText = "字幕: 關閉";
        btn.className = "ctrl-btn";
        setBadge($('sttBadge'), "粵語字幕: 已關閉", "off");
      }
    };

    // ====================================================
    // 音訊管道與「背景死咪自動重生」機制
    // ====================================================
    function playRogerBeep(freq = 1250, durationMs = 65) {
      if (!audioCtx || audioCtx.state !== 'running') return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.08 * rxVolume, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + durationMs / 1000);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + durationMs / 1000);
      } catch (e) {}
    }

    function setupAudioProcessor(forceRecreate = false) {
      if (!audioCtx) return;
      if (forceRecreate) {
        if (scriptNode) { try { scriptNode.disconnect(); } catch (e) {} scriptNode.onaudioprocess = null; scriptNode = null; }
        if (silencer) { try { silencer.disconnect(); } catch (e) {} silencer = null; }
      }
      if (scriptNode) return;

      scriptNode = audioCtx.createScriptProcessor(2048, 1, 1);
      silencer = audioCtx.createGain();
      silencer.gain.value = 0.0001;
      scriptNode.connect(silencer);
      silencer.connect(audioCtx.destination);

      scriptNode.onaudioprocess = (e) => {
        audioProcessFiredCount++;
        if (!isTalking || !client || !client.connected) return;
        const inputData = e.inputBuffer.getChannelData(0);

        let sumSq = 0;
        for (let i = 0; i < inputData.length; i++) sumSq += inputData[i] * inputData[i];
        const rms = Math.sqrt(sumSq / inputData.length);
        if (rms > 0.000001) nonZeroSignalCount++;

        const pct = Math.min(100, Math.round(rms * 400));
        $('micMeterFill').style.width = pct + "%";
        $('micMeterPct').innerText = pct + "%";

        if (rms * 2.4 < VOICE_RMS_THRESHOLD) {
          silentFrameCount++;
          if (!hasSpokenInCurrentPtt && silentFrameCount === 10) renderPresenceList();
          return;
        }

        hasSpokenInCurrentPtt = true;
        const packet = encodeAudioPacket(inputData, audioCtx.sampleRate);
        client.publish(currentTopic, packet, { qos: 0 });
        txCount++;
        updateDebug();
      };
    }

    async function refreshMicDeviceList() {
      if (!navigator.mediaDevices?.enumerateDevices) return;
      try {
        const devices = await navigator.mediaDevices.enumerateDevices();
        const audioInputs = devices.filter(d => d.kind === 'audioinput');
        if (!audioInputs.length) return;
        const activeId = selectedMicDeviceId || micStream?.getAudioTracks()[0]?.getSettings?.()?.deviceId || "";
        const sel = $('micSelect');
        sel.innerHTML = "";
        audioInputs.forEach((dev, idx) => {
          const opt = document.createElement('option');
          opt.value = dev.deviceId;
          opt.text = "🎙️ " + (dev.label || `麥克風 #${idx + 1}`);
          if (dev.deviceId === activeId) opt.selected = true;
          sel.appendChild(opt);
        });
      } catch (e) {}
    }

    $('micSelect').onchange = async (e) => {
      selectedMicDeviceId = e.target.value;
      if (micEnabled) {
        disableMicrophone();
        await enableMicrophone();
      }
    };

    // 檢查支咪係咪真係活緊（防止背景喚醒後變成 Zombie Stream）
    function isMicStreamHealthy() {
      if (!micStream || !micStream.active) return false;
      const tracks = micStream.getAudioTracks();
      if (!tracks.length) return false;
      const t = tracks[0];
      return t.readyState === 'live' && !t.muted;
    }

    async function enableMicrophone(forceRecreateNodes = false) {
      if (isRebuildingMic) return false;
      isRebuildingMic = true;
      try {
        if (micSourceNode) { try { micSourceNode.disconnect(); } catch (e) {} micSourceNode = null; }
        if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; }

        const constraints = { echoCancellation: true, noiseSuppression: true, autoGainControl: true };
        if (selectedMicDeviceId) constraints.deviceId = { exact: selectedMicDeviceId };

        try {
          micStream = await navigator.mediaDevices.getUserMedia({ audio: constraints });
        } catch {
          micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        }

        // 監聽系統背景切斷麥克風事件
        const track = micStream.getAudioTracks()[0];
        if (track) {
          track.onended = () => {
            micNeedsRefresh = true;
            setBadge($('micBadge'), "麥克風: 待喚醒重連", "warn");
          };
        }

        await refreshMicDeviceList();

        if (audioCtx) {
          await ensureAudioActive();
          setupAudioProcessor(forceRecreateNodes);
          micSourceNode = audioCtx.createMediaStreamSource(micStream);
          micSourceNode.connect(scriptNode);
        }

        const trackLabel = track?.label || "預設裝置";
        micEnabled = true;
        micNeedsRefresh = false;
        setBadge($('micBadge'), "麥克風: 就緒", "ok");
        $('toggleMicBtn').innerText = "停止麥克風";
        $('toggleMicBtn').className = "ctrl-btn mic-on";
        $('pttBtn').classList.remove('disabled-mic');
        if (!isTalking) {
          $('pttBtn').innerText = "按住通話 (PTT)";
          $('statusText').innerText = `已啟用: ${trackLabel}`;
        }
        isRebuildingMic = false;
        return true;
      } catch (err) {
        setBadge($('micBadge'), "麥克風: 需重連", "warn");
        $('statusText').innerText = "麥克風重連失敗，請按一下 PTT 重試";
        isRebuildingMic = false;
        return false;
      }
    }

    function disableMicrophone() {
      if (isTalking) stopTalking();
      if (micSourceNode) { try { micSourceNode.disconnect(); } catch (e) {} micSourceNode = null; }
      if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
      micEnabled = false;
      micNeedsRefresh = false;
      setBadge($('micBadge'), "麥克風: 純收聽", "off");
      $('toggleMicBtn').innerText = "重開麥克風";
      $('toggleMicBtn').className = "ctrl-btn mic-off";
      $('pttBtn').classList.add('disabled-mic');
      $('pttBtn').innerText = "純收聽模式\n(已關閉麥克風)";
      $('statusText').innerText = "已停止存取麥克風，目前為純收聽模式";
    }

    $('toggleMicBtn').onclick = async () => {
      await ensureAudioActive();
      if (micEnabled) disableMicrophone();
      else {
        $('statusText').innerText = "正在重新連接麥克風...";
        await enableMicrophone(true);
      }
    };

    async function requestWakeLock() {
      if ('wakeLock' in navigator) {
        try {
          wakeLock = await navigator.wakeLock.request('screen');
          setBadge($('wakeBadge'), "螢幕常亮: 已鎖定", "ok");
          wakeLock.addEventListener('release', () => setBadge($('wakeBadge'), "螢幕常亮: 已釋放", "warn"));
        } catch {
          setBadge($('wakeBadge'), "螢幕常亮: 手動設永不鎖屏", "warn");
        }
      }
    }

    async function ensureAudioActive() {
      if (!audioCtx) return;
      if (audioCtx.state === 'suspended' || audioCtx.state === 'interrupted') {
        try { await audioCtx.resume(); } catch (e) {}
      }
      // 如果 iOS PWA 背景返嚟將 AudioContext 徹底鎖死喺 closed，自動重建一個新嘅
      if (audioCtx.state === 'closed') {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        rxGainNode = audioCtx.createGain();
        rxGainNode.gain.value = rxVolume;
        rxGainNode.connect(audioCtx.destination);
        scriptNode = null;
        setupAudioProcessor(true);
      }
    }

    // 【核心自癒 1】：當 PWA 由背景返到前景時，自動強制換新麥克風 Stream！
    async function recoverFromBackground() {
      if (!audioCtx) return;
      await requestWakeLock();
      await ensureAudioActive();
      publishPresence('ping');

      const awayTimeMs = hiddenTimestamp > 0 ? (Date.now() - hiddenTimestamp) : 9999;
      // 只要離開超過 1.5 秒、或者支咪已經死咗，強制重新攞過支新咪！
      if (micEnabled && (awayTimeMs > 1500 || micNeedsRefresh || !isMicStreamHealthy())) {
        $('statusText').innerText = "🔄 由背景返回，正在自動重啟麥克風...";
        await enableMicrophone(true);
      }
    }

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'hidden') {
        hiddenTimestamp = Date.now();
        if (isTalking) stopTalking();
      } else if (document.visibilityState === 'visible') {
        recoverFromBackground();
      }
    });

    window.addEventListener('pageshow', (e) => {
      if (e.persisted || audioCtx) recoverFromBackground();
    });

    window.addEventListener('focus', () => {
      if (audioCtx && micEnabled && (!isMicStreamHealthy() || micNeedsRefresh)) {
        recoverFromBackground();
      }
    });

    document.body.addEventListener('touchstart', () => { if (audioCtx) ensureAudioActive(); }, { passive: true });

    // ====================================================
    // 主程序初始化與 MQTT 接收處理
    // ====================================================
    $('initBtn').onclick = async () => {
      $('initBtn').disabled = true;
      $('statusText').innerText = "正在啟動音訊引擎與語音辨識...";

      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      rxGainNode = audioCtx.createGain();
      rxGainNode.gain.value = rxVolume;
      rxGainNode.connect(audioCtx.destination);
      await ensureAudioActive();

      if (!(await enableMicrophone(true))) {
        $('initBtn').disabled = false;
        return;
      }

      initSpeechRecognition();
      applyChannelPassword($('channelPasswordInput').value.trim());

      if (keepAliveTimer) clearInterval(keepAliveTimer);
      keepAliveTimer = setInterval(() => {
        if (!audioCtx) return;
        ensureAudioActive();
        if (audioCtx.state === 'running' && !isTalking) {
          const src = audioCtx.createBufferSource();
          src.buffer = audioCtx.createBuffer(1, 1, audioCtx.sampleRate);
          src.connect(audioCtx.destination);
          src.start();
        }
      }, 20000);

      await requestWakeLock();
      $('statusText').innerText = `音訊就緒 (${audioCtx.sampleRate}Hz)，正在連線伺服器...`;

      client = mqtt.connect(MQTT_BROKER, {
        clientId: "Walkie_" + MY_ID_HEX + "_" + Math.random().toString(16).slice(2, 6),
        clean: true, keepalive: 25, reconnectPeriod: 2000, connectTimeout: 10000
      });

      client.on('connect', () => {
        setBadge($('netBadge'), "網絡: 在線", "ok");
        $('pttBtn').classList.remove('offline');
        $('initBtn').style.display = 'none';
        $('controlsDetails').style.display = 'block';
        $('presencePanel').style.display = 'block';
        $('micMeterWrap').style.display = 'flex';
        $('pttBtn').style.display = 'block';
        $('chatBox').style.display = 'block';
        $('manualSubRow').style.display = 'flex';
        client.subscribe([currentTopic, currentTextTopic, currentPresenceTopic], { qos: 0 });
        if (heartbeatTimer) clearInterval(heartbeatTimer);
        publishPresence('ping');
        heartbeatTimer = setInterval(() => { publishPresence('ping'); renderPresenceList(); }, 1000);
        playRogerBeep(1400, 60);
      });

      client.on('reconnect', () => {
        setBadge($('netBadge'), "網絡: 重連中...", "warn");
        $('pttBtn').classList.add('offline');
      });

      client.on('offline', () => {
        setBadge($('netBadge'), "網絡: 離線", "warn");
        $('pttBtn').classList.add('offline');
        if (isTalking) stopTalking();
      });

      client.on('message', (topic, payload) => {
        if (topic === currentPresenceTopic) {
          try {
            const data = JSON.parse(new TextDecoder().decode(payload));
            if (!data.sender || data.sender === MY_ID_HEX || data.magic !== currentMagic) return;
            const now = Date.now();
            if (!peers[data.sender]) {
              peers[data.sender] = { dev: data.dev || '👤', lastSeen: now, lastAck: 0, lastSpeak: 0, ackCount: 0 };
            }
            peers[data.sender].lastSeen = now;
            if (data.dev) peers[data.sender].dev = data.dev;
            if (data.type === 'ack' && data.target === MY_ID_HEX) {
              peers[data.sender].lastAck = now;
              peers[data.sender].ackCount = (peers[data.sender].ackCount || 0) + 1;
            }
            renderPresenceList();
          } catch (e) {}
          return;
        }

        if (topic === currentTextTopic) {
          try {
            const data = JSON.parse(new TextDecoder().decode(payload));
            if (data.magic === currentMagic && data.sender && data.sender !== MY_ID_HEX && data.text) {
              upsertChatMessage(data.sender, data.text, data.final, false);
            }
          } catch (e) {}
          return;
        }

        if (topic !== currentTopic || isTalking || payload.byteLength <= 8) return;
        const view = new DataView(payload.buffer, payload.byteOffset, payload.byteLength);
        if (view.getUint32(0, true) !== currentMagic) return;
        const senderId = view.getUint32(4, true);
        if (senderId === MY_ID) return;

        const audioLen = payload.byteLength - 8;
        const srcBytes = new Uint8Array(payload.buffer, payload.byteOffset + 8, audioLen);
        let sumSq = 0;
        for (let i = 0; i < audioLen; i++) {
          const b = cipherMask ? (srcBytes[i] ^ cipherMask[i & 63]) : srcBytes[i];
          const s = ULAW_DECODE[b];
          sumSq += s * s;
        }
        if (Math.sqrt(sumSq / audioLen) < VOICE_RMS_THRESHOLD) return;

        const senderHex = senderId.toString(16).toUpperCase().padStart(8, '0').slice(0, 4);
        rxCount++;
        updateDebug();

        const now = Date.now();
        if (!peers[senderHex]) {
          peers[senderHex] = { dev: '👤', lastSeen: now, lastAck: 0, lastSpeak: now, ackCount: 0 };
        } else {
          peers[senderHex].lastSeen = now;
          peers[senderHex].lastSpeak = now;
        }
        sendRxAck(senderHex);
        renderPresenceList();

        if (IS_MOBILE && micStream && !isTalking) {
          micStream.getAudioTracks().forEach(t => t.enabled = false);
        }

        $('pttBtn').classList.add('receiving');
        $('pttBtn').innerText = `對方 (${senderHex})\n講話中...`;
        $('statusText').innerText = `🔊 正在播放 [${senderHex}] 嘅語音 (已回傳收聽確認)...`;

        clearTimeout(rxTimeout);
        rxTimeout = setTimeout(() => {
          if (!isTalking) {
            if (micStream && micEnabled) micStream.getAudioTracks().forEach(t => t.enabled = true);
            $('pttBtn').classList.remove('receiving');
            $('pttBtn').innerText = micEnabled ? "按住通話 (PTT)" : "純收聽模式\n(已關閉麥克風)";
            $('statusText').innerText = micEnabled ? "已連線！放開收聽，按住通話" : "純收聽模式待命中";
            playRogerBeep(1150, 70);
            renderPresenceList();
          }
        }, 350);

        playIncomingUlaw(srcBytes);
      });
    };

    function playIncomingUlaw(srcBytes) {
      if (!audioCtx) return;
      if (audioCtx.state !== 'running') audioCtx.resume();
      const inLen = srcBytes.length;
      if (!inLen) return;
      const nativeRate = audioCtx.sampleRate;
      const ratio = nativeRate / TARGET_RATE;
      const outLen = Math.floor(inLen * ratio);
      const audioBuffer = audioCtx.createBuffer(1, outLen, nativeRate);
      const upsampled = audioBuffer.getChannelData(0);

      for (let i = 0; i < outLen; i++) {
        const pos = i / ratio;
        const idx = Math.floor(pos);
        const frac = pos - idx;
        const b0 = idx === 0 ? -1 : (cipherMask ? (srcBytes[idx - 1] ^ cipherMask[(idx - 1) & 63]) : srcBytes[idx - 1]);
        const b1 = cipherMask ? (srcBytes[idx] ^ cipherMask[idx & 63]) : srcBytes[idx];
        const s0 = idx === 0 ? lastSample : ULAW_DECODE[b0];
        const s1 = ULAW_DECODE[b1];
        upsampled[i] = s0 + frac * (s1 - s0);
      }

      const fadeLen = Math.min(24, Math.floor(outLen / 10));
      for (let i = 0; i < fadeLen; i++) {
        const w = i / fadeLen;
        upsampled[i] = lastSample * (1 - w) + upsampled[i] * w;
      }
      const lastByte = cipherMask ? (srcBytes[inLen - 1] ^ cipherMask[(inLen - 1) & 63]) : srcBytes[inLen - 1];
      lastSample = ULAW_DECODE[lastByte];

      const source = audioCtx.createBufferSource();
      source.buffer = audioBuffer;
      source.connect(rxGainNode || audioCtx.destination);
      const now = audioCtx.currentTime;
      if (nextStartTime < now || (nextStartTime - now) > 0.16) nextStartTime = now + 0.04;
      source.start(nextStartTime);
      nextStartTime += audioBuffer.duration;
    }

    function encodeAudioPacket(float32Buffer, inputRate) {
      const ratio = inputRate / TARGET_RATE;
      const sampleCount = Math.floor(float32Buffer.length / ratio);
      const packet = new Uint8Array(8 + sampleCount);
      const view = new DataView(packet.buffer);
      view.setUint32(0, currentMagic, true);
      view.setUint32(4, MY_ID, true);
      for (let i = 0; i < sampleCount; i++) {
        const start = Math.floor(i * ratio);
        const end = Math.min(Math.floor((i + 1) * ratio), float32Buffer.length);
        let sum = 0;
        for (let j = start; j < end; j++) sum += float32Buffer[j];
        let avg = (end > start) ? (sum / (end - start)) : float32Buffer[start];
        avg = Math.abs(avg) < 0.004 ? (avg * 0.2) : (avg * 2.4);
        let clamped = Math.max(-1, Math.min(1, avg));
        let ulawByte = linearToUlaw((clamped < 0 ? clamped * 32768 : clamped * 32767) | 0);
        packet[8 + i] = cipherMask ? (ulawByte ^ cipherMask[i & 63]) : ulawByte;
      }
      return packet;
    }

    // ====================================================
    // PTT 發話控制 (含 0.6s 死咪自動偵測重連 Watchdog)
    // ====================================================
    const pttBtn = $('pttBtn');
    pttBtn.addEventListener('touchstart', (e) => { e.preventDefault(); startTalking(); });
    pttBtn.addEventListener('touchend', (e) => { e.preventDefault(); stopTalking(); });
    pttBtn.addEventListener('touchcancel', (e) => { e.preventDefault(); stopTalking(); });
    pttBtn.addEventListener('mousedown', (e) => { if (e.button === 0) { e.preventDefault(); startTalking(); } });
    window.addEventListener('mouseup', () => { if (isTalking) stopTalking(); });

    async function startTalking() {
      if (!micEnabled) {
        $('statusText').innerText = "請先點擊上方「重開麥克風」才可發話！";
        return;
      }
      if (!client || !client.connected || isTalking) return;

      isTalking = true;
      hasSpokenInCurrentPtt = false;
      silentFrameCount = 0;
      audioProcessFiredCount = 0;
      nonZeroSignalCount = 0;
      clearTimeout(rxTimeout);
      clearTimeout(sttStopTimer);
      clearTimeout(pttWatchdogTimer);

      for (const id in peers) peers[id].ackCount = 0;
      renderPresenceList();

      pttBtn.classList.remove('receiving');
      pttBtn.classList.add('active');
      pttBtn.innerText = "正在廣播中...";
      $('statusText').innerText = "🎙️ 請講話... (正同步傳送語音及字幕)";

      await ensureAudioActive();

      // 如果支咪已經唔健康或者標記咗需要刷新，即刻喺用戶手勢內重新攞咪！
      if (micNeedsRefresh || !isMicStreamHealthy()) {
        $('statusText').innerText = "🔄 正在喚醒麥克風...";
        await enableMicrophone(true);
      } else if (micStream) {
        micStream.getAudioTracks().forEach(t => t.enabled = true);
      }

      if (!isTalking) return;

      if (sttEnabled && recognition && !recognitionActive) {
        currentTranscript = "";
        try { recognition.start(); } catch (e) {}
      }

      playRogerBeep(1500, 45);

      // 【核心自癒 2】：如果撳住 PTT 600ms 後發現 Audio 引擎死寂 (無觸發或全 0 死數據)，即時自動重建！
      pttWatchdogTimer = setTimeout(async () => {
        if (!isTalking) return;
        if (audioProcessFiredCount === 0 || nonZeroSignalCount === 0) {
          $('statusText').innerText = "⚡ 偵測到背景麥克風休眠，正在自動重啟...";
          await ensureAudioActive();
          await enableMicrophone(true);
          if (isTalking) {
            $('statusText').innerText = "✅ 麥克風已自動修復！請話題繼續...";
          }
        }
      }, 600);
    }

    function stopTalking() {
      if (!isTalking) return;
      isTalking = false;
      clearTimeout(pttWatchdogTimer);
      $('micMeterFill').style.width = "0%";
      $('micMeterPct').innerText = "0%";
      pttBtn.classList.remove('active');
      pttBtn.innerText = micEnabled ? "按住通話 (PTT)" : "純收聽模式\n(已關閉麥克風)";
      $('statusText').innerText = "通話結束，放開收聽中";

      playRogerBeep(1050, 60);

      clearTimeout(sttStopTimer);
      sttStopTimer = setTimeout(() => {
        if (!isTalking && recognition && recognitionActive) {
          try { recognition.stop(); } catch (e) {}
        }
      }, 350);
    }
  </script>
</body>
</html>
